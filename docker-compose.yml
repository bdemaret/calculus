# Base PostgreSQL locale pour le développement : `pnpm db:up`
# Port 5433 sur ton ordinateur, pour ne pas gêner un autre PostgreSQL déjà installé (port 5432).
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: calculus
      POSTGRES_PASSWORD: calculus
      POSTGRES_DB: calculus
    ports:
      - "5433:5432"
    volumes:
      - calculus-db:/var/lib/postgresql/data
volumes:
  calculus-db:
