<title>Calculus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=Caveat:wght@500;700&display=swap">
<style>
/* Mise en page : une page de cahier Seyès. Marge rouge à gauche (annotations du « prof »), contenu aligné à gauche sur le quadrillage. */
:root {
  --paper: #f7f9fc;
  --surface: #ffffff;
  --line: #dce5f4;
  --line-strong: #b3c5e6;
  --margin-red: #e2384d;
  --ink: #1f3a9e;
  --ink-hover: #172d80;
  --on-ink: #ffffff;
  --text: #1c2033;
  --muted: #59637f;
  --hl: #ffe14d;
  --hl-late: #ff9fb0;
  --ok: #138a55;
  --ko: #d7263d;
  --hl-blend: multiply;

  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-hand: "Caveat", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;

  --m: 84px;          /* largeur de la marge */
  --grid: 32px;       /* grand carreau Seyès */
  --sub: 8px;         /* petite ligne */
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #17231e; --surface: #1e2c26; --line: rgba(226,238,232,.055); --line-strong: rgba(226,238,232,.12);
    --margin-red: #ff6f7e; --ink: #a9c1ff; --ink-hover: #c4d4ff; --on-ink: #0f1a3a; --text: #edf0e8; --muted: #9db0a7;
    --hl: #ffd84a; --hl-late: #ff8a9b; --ok: #52d69a; --ko: #ff6f7e; --hl-blend: normal; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #17231e; --surface: #1e2c26; --line: rgba(226,238,232,.055); --line-strong: rgba(226,238,232,.12);
  --margin-red: #ff6f7e; --ink: #a9c1ff; --ink-hover: #c4d4ff; --on-ink: #0f1a3a; --text: #edf0e8; --muted: #9db0a7;
  --hl: #ffd84a; --hl-late: #ff8a9b; --ok: #52d69a; --ko: #ff6f7e; --hl-blend: normal; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  color: var(--text);
  font-family: var(--font-display);
  font-size: 17px;
  line-height: 1.5;
  font-variation-settings: "opsz" 16;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--line-strong) 1px, transparent 1px),
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 100% var(--grid), 100% var(--sub), var(--grid) 100%;
  background-position: 0 0, 0 0, var(--m) 0;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--hl); outline-offset: 2px; border-radius: 4px; }

.sheet {
  display: grid;
  grid-template-columns: var(--m) minmax(0, 1fr);
  min-height: 100vh;
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.margin {
  border-right: 2px solid var(--margin-red);
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: 8px;
  padding-block: 24px;
  font-family: var(--font-hand);
  color: var(--margin-red);
  text-align: right;
}
.content { padding-left: 28px; padding-block: 0 64px; min-width: 0; max-width: 1080px; }

/* En-tête */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; min-height: 96px; padding-block: 16px; }
.brand { display: flex; align-items: baseline; gap: 10px; background: none; border: 0; padding: 0; cursor: pointer; }
.brand-name { font-size: 30px; font-weight: 800; letter-spacing: -0.03em; font-variation-settings: "opsz" 96, "wdth" 85; color: var(--ink); }
.brand-note { font-family: var(--font-hand); font-size: 22px; color: var(--margin-red); transform: rotate(-3deg); }
.tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.icon-btn { background: transparent; border: 1.5px solid var(--line-strong); border-radius: 999px; height: 38px; min-width: 38px; padding: 0 12px; cursor: pointer; color: var(--muted); font-size: 15px; }
.icon-btn:hover { color: var(--ink); border-color: var(--ink); }
.icon-btn[aria-pressed="false"] { text-decoration: line-through; }

/* Boutons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: var(--radius); padding: 13px 22px; font-weight: 650; font-size: 17px; cursor: pointer; border: 1.5px solid var(--ink); background: var(--ink); color: var(--on-ink); transition: background .15s, transform .1s; }
.btn:hover { background: var(--ink-hover); border-color: var(--ink-hover); }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.ghost:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.link-btn { background: none; border: 0; padding: 0; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

h1, h2, h3 { text-wrap: balance; margin: 0; letter-spacing: -0.02em; font-variation-settings: "opsz" 72; }
h2 { font-size: 34px; font-weight: 750; line-height: 1.1; }
h3 { font-size: 20px; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.stack { display: grid; gap: 16px; }

/* Accueil */
.lede { font-size: 22px; color: var(--muted); max-width: 32ch; margin-top: 8px; }
.hero { padding-block: 32px 40px; display: grid; gap: 8px; }
.hero-calc { display: flex; align-items: baseline; flex-wrap: wrap; column-gap: 20px; row-gap: 0; }
.calc { font-size: clamp(64px, 15vw, 176px); font-weight: 760; line-height: 1; letter-spacing: -0.03em; font-variation-settings: "opsz" 96, "wdth" 82; font-variant-numeric: tabular-nums; white-space: nowrap; }
.calc.long { font-size: clamp(40px, 9vw, 120px); white-space: normal; }
.eq { color: var(--muted); font-weight: 400; }
.answer {
  width: 4.2ch; min-width: 2ch; background: transparent; border: 0; border-bottom: 3px dashed var(--line-strong);
  color: var(--ink); font-size: inherit; font-weight: 700; font-variation-settings: "opsz" 96, "wdth" 82; padding: 0; line-height: 1; caret-color: var(--margin-red);
  font-variant-numeric: tabular-nums;
}
.answer:focus { outline: none; border-bottom-color: var(--ink); }
.answer.wrong { color: var(--ko); text-decoration: line-through; text-decoration-thickness: .08em; }
.answer.right { color: var(--ok); }
.answer:disabled { opacity: 1; }
.hint { font-family: var(--font-hand); font-size: 24px; color: var(--muted); }
.mark { font-family: var(--font-hand); font-size: clamp(28px, 4vw, 40px); line-height: 1; align-self: center; }
.mark.ok { color: var(--ok); } .mark.ko { color: var(--ko); }
.check { width: 1.1em; height: 1.1em; vertical-align: -0.15em; }
.check path { stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw .35s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }

.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; max-width: 760px; }
.choice { text-align: left; display: grid; gap: 4px; padding: 22px 24px; border-radius: 14px; border: 2px solid var(--ink); background: var(--surface); cursor: pointer; transition: transform .12s, box-shadow .12s; }
.choice:hover { transform: translateY(-2px); box-shadow: 0 6px 0 -1px color-mix(in srgb, var(--ink) 30%, transparent); }
.choice.primary { background: var(--ink); color: var(--on-ink); }
.choice-title { font-size: 28px; font-weight: 760; letter-spacing: -0.02em; font-variation-settings: "opsz" 72; }
.choice-sub { opacity: .8; }

.modes { margin-top: 56px; display: grid; gap: 20px; max-width: 760px; }
.mode-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
.mode-item { display: grid; gap: 6px; }
.mode-item h3 { display: flex; align-items: baseline; gap: 10px; }
.tag { font-family: var(--font-hand); font-size: 22px; color: var(--margin-red); font-weight: 700; }

/* Formulaires de paramètres */
.panel { background: var(--surface); border: 1.5px solid var(--line-strong); border-radius: 14px; padding: 24px; display: grid; gap: 22px; min-width: 0; }
.field { display: grid; gap: 10px; border: 0; padding: 0; margin: 0; min-width: 0; }
.field > legend, .field-label { font-weight: 700; font-size: 15px; padding: 0; color: var(--text); }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button { border: 1.5px solid var(--line-strong); background: var(--paper); border-radius: 10px; padding: 9px 14px; cursor: pointer; font-weight: 600; min-width: 48px; }
.seg button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.seg.ops button { font-size: 22px; min-width: 56px; padding: 6px 10px; font-weight: 700; }
.mode-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.mode-card { text-align: left; border: 1.5px solid var(--line-strong); background: var(--paper); border-radius: 12px; padding: 14px 16px; cursor: pointer; display: grid; gap: 2px; }
.mode-card strong { font-size: 18px; }
.mode-card span { color: var(--muted); font-size: 15px; }
.mode-card[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.explain { font-size: 15px; color: var(--muted); max-width: 62ch; }
.example { font-family: var(--font-hand); font-size: 26px; color: var(--ink); }
.range-row { display: flex; align-items: center; gap: 14px; }
.range-row input[type="range"] { flex: 1; accent-color: var(--ink); min-width: 0; }
.range-value { font-weight: 700; min-width: 4.5ch; text-align: right; font-variant-numeric: tabular-nums; }

.setup { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; max-width: 760px; padding-top: 8px; }
.setup-head { display: grid; gap: 6px; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

/* En ligne */
.online { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; max-width: 860px; }
.text-input { width: 100%; border: 1.5px solid var(--line-strong); background: var(--paper); border-radius: 10px; padding: 12px 14px; font-size: 18px; }
.text-input:focus { outline: none; border-color: var(--ink); }
.code-input { text-transform: uppercase; letter-spacing: .3em; font-weight: 700; font-variant-numeric: tabular-nums; }
.note { font-family: var(--font-hand); font-size: 22px; color: var(--margin-red); line-height: 1.15; }

/* Lobby */
.lobby { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.code-boxes { display: flex; gap: 0; margin-top: 6px; }
.code-boxes span { width: var(--grid); height: calc(var(--grid) * 1.5); display: grid; place-items: center; border: 1.5px solid var(--ink); margin-left: -1.5px; font-size: 28px; font-weight: 800; color: var(--ink); background: var(--surface); font-variant-numeric: tabular-nums; }
.code-boxes span:first-child { border-radius: 8px 0 0 8px; margin-left: 0; }
.code-boxes span:last-child { border-radius: 0 8px 8px 0; }
.slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.slot { border: 1.5px solid var(--line-strong); border-radius: 10px; padding: 10px 12px; min-height: 50px; display: flex; align-items: center; gap: 8px; background: var(--paper); min-width: 0; }
.slot.empty { border-style: dashed; color: var(--muted); font-size: 14px; }
.slot.filled { background: var(--surface); animation: pop .28s ease-out; }
.slot .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.avatar { width: 26px; height: 26px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 800; color: var(--on-ink); background: var(--ink); }
.host { font-family: var(--font-hand); color: var(--margin-red); font-size: 18px; margin-left: auto; }
@keyframes pop { from { transform: scale(.92); opacity: .3; } to { transform: none; opacity: 1; } }

/* Partie */
.game { display: grid; gap: 22px; padding-top: 8px; }
.timer { height: 18px; position: relative; max-width: 860px; }
.timer-fill { position: absolute; inset: 0; background: var(--hl); border-radius: 3px 8px 5px 3px; transform-origin: left center; mix-blend-mode: var(--hl-blend); opacity: .9; }
.timer-fill.late { background: var(--hl-late); }
.status { font-family: var(--font-hand); font-size: 28px; color: var(--muted); min-height: 36px; }
.status strong { color: var(--ink); }
.game-row { display: flex; align-items: baseline; flex-wrap: wrap; column-gap: 20px; min-height: 1.1em; }
.result-line { font-family: var(--font-hand); font-size: clamp(30px, 5vw, 48px); min-height: 1.2em; line-height: 1.1; }
.result-line .ok { color: var(--ok); } .result-line .ko { color: var(--ko); }
.players { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 999px; border: 1.5px solid var(--line-strong); background: var(--surface); font-weight: 600; font-size: 15px; transition: border-color .2s; }
.chip .pts { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 700; }
.chip.answered { border-color: var(--ink); }
.chip.right { border-color: var(--ok); }
.chip.wrong { border-color: var(--ko); }
.chip.out { opacity: .5; text-decoration: line-through; }
.chip.active { box-shadow: 0 0 0 3px var(--hl); }
.chip.me .nm::after { content: " (toi)"; color: var(--muted); font-weight: 500; }
.count { font-size: clamp(120px, 26vw, 260px); font-weight: 800; color: var(--ink); line-height: 1; font-variation-settings: "opsz" 96, "wdth" 80; animation: beat .9s ease-out; }
@keyframes beat { from { transform: scale(1.25); opacity: 0; } 30% { opacity: 1; } to { transform: none; } }
.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

.keypad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; max-width: 360px; }
.keypad button { height: 58px; border-radius: 12px; border: 1.5px solid var(--line-strong); background: var(--surface); font-size: 24px; font-weight: 700; cursor: pointer; touch-action: manipulation; }
.keypad button:active { background: var(--line); }
.keypad .ok-key { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }

.margin-note { display: block; font-size: 26px; line-height: 1; margin-bottom: 18px; }
.margin-note small { display: block; font-size: 17px; opacity: .85; }
.grade { display: inline-grid; place-items: center; width: 60px; height: 60px; border: 2.5px solid var(--margin-red); border-radius: 50%; font-size: 30px; font-weight: 700; transform: rotate(-6deg); }

/* Rapport */
.report { display: grid; gap: 28px; padding-top: 8px; max-width: 900px; }
.verdict { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; }
.verdict .big { font-family: var(--font-hand); font-size: clamp(64px, 12vw, 120px); line-height: .9; color: var(--margin-red); transform: rotate(-3deg); display: inline-block; }
.ranking { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; max-width: 560px; }
.ranking li { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 10px; background: var(--surface); border: 1.5px solid var(--line-strong); }
.ranking li.me { border-color: var(--ink); }
.ranking .rk { font-weight: 800; font-size: 20px; color: var(--ink); font-variant-numeric: tabular-nums; }
.ranking .sc { font-weight: 700; font-variant-numeric: tabular-nums; }
.ranking .sub { color: var(--muted); font-size: 14px; display: block; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border: 1.5px solid var(--line-strong); border-radius: 14px; background: var(--surface); overflow: hidden; }
.stat { padding: 16px 18px; display: grid; gap: 2px; border-left: 1.5px solid var(--line); }
.stat:first-child { border-left: 0; }
.stat .v { font-size: 30px; font-weight: 760; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.stat .k { color: var(--muted); font-size: 14px; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.bars { display: grid; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 130px minmax(0, 1fr) 48px; gap: 10px; align-items: center; font-size: 15px; }
.bar { height: 12px; background: var(--line); border-radius: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ink); border-radius: 6px; }
.bar-row .pc { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-display); }
.callout { font-size: 15px; color: var(--muted); }
.callout b { color: var(--text); font-size: 22px; font-weight: 750; display: block; font-variant-numeric: tabular-nums; }

@media (max-width: 720px) {
  :root { --m: 44px; }
  body { font-size: 16px; }
  .content { padding-left: 14px; }
  .margin { padding-right: 4px; }
  .brand-note { display: none; }
  .top { min-height: 0; }
  .icon-btn { height: 34px; min-width: 34px; padding: 0 10px; font-size: 14px; }
  .calc { font-size: clamp(48px, 15vw, 176px); white-space: normal; }
  .choices, .mode-list, .online, .lobby, .two, .mode-cards { grid-template-columns: minmax(0, 1fr); }
  .slots { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat:nth-child(3) { border-left: 0; }
  .stat:nth-child(n+3) { border-top: 1.5px solid var(--line); }
  .margin-note { font-size: 20px; }
  .margin-note small { font-size: 14px; }
  .grade { width: 36px; height: 36px; font-size: 18px; }
  .bar-row { grid-template-columns: 96px minmax(0, 1fr) 42px; }
  .code-boxes span { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}
</style>

<div class="sheet">
  <aside class="margin" id="margin" aria-live="polite"></aside>
  <div class="content">
    <header class="top">
      <button class="brand" id="home" type="button" aria-label="Retour à l'accueil">
        <span class="brand-name">Calculus</span><span class="brand-note">calcul mental</span>
      </button>
      <div class="tools">
        <button class="icon-btn" id="modesBtn" type="button">Modes</button>
        <button class="icon-btn" id="soundBtn" type="button" aria-pressed="true">Son</button>
        <button class="icon-btn" id="loginBtn" type="button" title="La connexion arrive avec la V1 complète">Se connecter</button>
      </div>
    </header>
    <main id="app"></main>
  </div>

<script>
(() => {
"use strict";
const C = window.Core;
const $ = (s, el = document) => el.querySelector(s);
const app = $("#app");
const margin = $("#margin");
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const fmtS = (ms) => (ms / 1000).toLocaleString("fr-FR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + " s";
const pct = (x) => Math.round(x * 100) + " %";
const touch = window.matchMedia("(pointer: coarse)").matches;

const store = {
  get(k, d) { try { const v = localStorage.getItem("calculus:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("calculus:" + k, JSON.stringify(v)); } catch {} },
};
const prefs = {
  name: store.get("name", ""),
  sound: store.get("sound", true),
  solo: C.sanitizeSettings(store.get("solo", C.defaultSettings(2, "speed-race"))),
  online: C.sanitizeSettings(store.get("online", C.defaultSettings(2, "battle-royale"))),
};

/* ---------- Sons (synthétisés, aucun fichier) ---------- */
let actx = null;
function tone(freqs, dur = 0.09, type = "sine", gain = 0.07) {
  if (!prefs.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = actx.currentTime;
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f;
      const s = t0 + i * dur;
      g.gain.setValueAtTime(0, s);
      g.gain.linearRampToValueAtTime(gain, s + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, s + dur * 1.8);
      o.connect(g).connect(actx.destination);
      o.start(s); o.stop(s + dur * 2);
    });
  } catch {}
}
const sfx = {
  ok: () => tone([660, 990], 0.07),
  ko: () => tone([196, 147], 0.12, "square", 0.04),
  tick: () => tone([740], 0.05, "sine", 0.04),
  go: () => tone([523, 784], 0.08),
  out: () => tone([330, 247, 196], 0.1, "triangle", 0.05),
  win: () => tone([523, 659, 784, 1047], 0.11),
};
const confetti = (opts) => { try { window.confetti && window.confetti(opts); } catch {} };

/* ---------- Textes ---------- */
const MODE_INFO = {
  "battle-royale": {
    name: "Battle royale", short: "Une erreur et tu sors.",
    long: "Tout le monde reçoit le même calcul. Une mauvaise réponse ou un temps écoulé, et tu es éliminé. Le temps raccourcit à chaque manche. Le dernier en vie gagne ; si tous les survivants se trompent sur la même manche, personne ne sort.",
    solo: "Enchaîne les calculs sans faute le plus longtemps possible. Le temps raccourcit à chaque manche.",
  },
  "speed-race": {
    name: "Course de vitesse", short: "Un point pour le plus rapide.",
    long: "À chaque calcul, le premier qui trouve la bonne réponse marque le point. Une seule réponse par calcul : si tu te trompes, tu laisses la manche aux autres. En cas d'égalité, le plus rapide au total gagne.",
    solo: "Une série de calculs, un point par bonne réponse. Ton temps moyen compte pour ta progression.",
  },
};
const LEVEL_NAMES = { 1: "Facile", 2: "Moyen", 3: "Difficile", 4: "Expert", 5: "Légende" };
const OP_SYMBOL = { add: "+", sub: "−", mul: "×", div: "÷" };
const OP_NAMES = { add: "Additions", sub: "Soustractions", mul: "Multiplications", div: "Divisions", paren: "Parenthèses" };
const BOT_NAMES = ["Ada", "Euclide", "Hypatie", "Gauss", "Noether", "Pascal", "Fermat", "Sophie", "Ramanujan", "Turing", "Sofia"];

/* ---------- En-tête ---------- */
const soundBtn = $("#soundBtn");
const syncSound = () => { soundBtn.setAttribute("aria-pressed", String(prefs.sound)); soundBtn.title = prefs.sound ? "Couper le son" : "Activer le son"; };
syncSound();
soundBtn.onclick = () => { prefs.sound = !prefs.sound; store.set("sound", prefs.sound); syncSound(); if (prefs.sound) sfx.ok(); };
$("#home").onclick = () => { stopGame(); showHome(); };
$("#modesBtn").onclick = () => { stopGame(); showModes(); };
$("#loginBtn").onclick = () => {
  setMargin(`<span class="margin-note">V1<small>comptes, stats</small></span>`);
  $("#loginBtn").textContent = "Bientôt";
  setTimeout(() => ($("#loginBtn").textContent = "Se connecter"), 1800);
};

function setMargin(html) { margin.innerHTML = html; }
function view(html) { app.innerHTML = html; window.scrollTo({ top: 0 }); }

/* =================================================================== */
/* Accueil : on peut jouer dès la première seconde                       */
/* =================================================================== */
let heroTimer = null;
function showHome() {
  clearTimeout(heroTimer);
  setMargin(`<span class="margin-note" id="streakNote"></span>`);
  view(`
    <section class="hero">
      <p class="lede">Calcul mental, seul ou jusqu'à douze joueurs en ligne.</p>
      <form class="hero-calc" id="heroForm" autocomplete="off">
        <span class="calc" id="heroCalc"><span id="heroQ"></span> <span class="eq">=</span> <input id="heroInput" class="answer" ${touch ? 'inputmode="none" readonly' : 'inputmode="numeric"'} aria-label="Ta réponse"></span>
        <span class="mark" id="heroMark"></span>
      </form>
      <p class="hint" id="heroHint">${touch ? "Touche les chiffres ci-dessous." : "Tape ta réponse, puis Entrée."}</p>
      ${touch ? keypadHTML("heroPad") : ""}
    </section>
    <section class="choices" aria-label="Choisir une façon de jouer">
      <button class="choice primary" type="button" data-go="online"><span class="choice-title">Jouer en ligne</span><span class="choice-sub">Crée un lobby ou rejoins tes amis avec un code.</span></button>
      <button class="choice" type="button" data-go="solo"><span class="choice-title">Jouer solo</span><span class="choice-sub">Cinq niveaux, du « 7 + 4 » au « 125 × 8 − 36 ÷ 4 ».</span></button>
    </section>
    <section class="modes">
      <h2>Deux modes de jeu</h2>
      <div class="mode-list">${modeItems()}</div>
    </section>`);
  app.querySelectorAll("[data-go]").forEach((b) => (b.onclick = () => (b.dataset.go === "solo" ? showSoloSetup() : showOnline())));

  let streak = 0, q, shownAt;
  const input = $("#heroInput");
  const next = () => {
    q = C.generateQuestion(C.randomSeed(), 0, { difficulty: 2, operations: ["add", "sub", "mul"], parentheses: false });
    $("#heroQ").textContent = q.text;
    input.value = ""; input.className = "answer"; input.disabled = false; sizeInput(input);
    $("#heroMark").innerHTML = "";
    shownAt = performance.now();
    if (!touch) input.focus({ preventScroll: true });
  };
  const submit = () => {
    if (input.value === "" || input.disabled) return;
    const ok = Number(input.value) === q.answer;
    const ms = performance.now() - shownAt;
    input.disabled = true;
    input.classList.add(ok ? "right" : "wrong");
    if (ok) { streak++; sfx.ok(); $("#heroMark").className = "mark ok"; $("#heroMark").innerHTML = checkSVG() + " " + fmtS(ms); }
    else { streak = 0; sfx.ko(); $("#heroMark").className = "mark ko"; $("#heroMark").textContent = "non, " + q.answer; $("#heroCalc").classList.add("shake"); setTimeout(() => $("#heroCalc")?.classList.remove("shake"), 320); }
    const note = $("#streakNote");
    if (note) note.innerHTML = streak > 1 ? `${streak}<small>de suite</small>` : "";
    heroTimer = setTimeout(next, ok ? 900 : 1600);
  };
  $("#heroForm").onsubmit = (e) => { e.preventDefault(); submit(); };
  input.oninput = () => { input.value = input.value.replace(/\D/g, "").slice(0, 6); sizeInput(input); };
  if (touch) bindKeypad("heroPad", input, submit);
  next();
}

function bindSettings(id, getS, setS, rerender) {
  const root = $("#" + id);
  root.querySelectorAll("[data-mode]").forEach((b) => (b.onclick = () => { setS({ ...getS(), mode: b.dataset.mode }); rerender(); }));
  root.querySelectorAll("[data-diff]").forEach((b) => (b.onclick = () => {
    const d = Number(b.dataset.diff), base = C.defaultSettings(d);
    setS({ ...getS(), difficulty: d, operations: base.operations, parentheses: base.parentheses, timePerQuestion: base.timePerQuestion });
    rerender();
  }));
  root.querySelectorAll("[data-op]").forEach((b) => (b.onclick = () => {
    const s = getS(), o = b.dataset.op;
    const ops = s.operations.includes(o) ? s.operations.filter((x) => x !== o) : [...s.operations, o];
    if (ops.length === 0) { b.classList.add("shake"); setTimeout(() => b.classList.remove("shake"), 320); return; }
    setS({ ...s, operations: C.ALL_OPERATIONS.filter((x) => ops.includes(x)) }); rerender();
  }));
  const p = root.querySelector("[data-paren]");
  p.onclick = () => { setS({ ...getS(), parentheses: !getS().parentheses }); rerender(); };
  root.querySelectorAll("[data-turn]").forEach((b) => (b.onclick = () => { setS({ ...getS(), turnStyle: b.dataset.turn }); rerender(); }));
  const r = $("#" + id + "-rounds");
  if (r) r.oninput = () => { r.nextElementSibling.textContent = r.value; setS({ ...getS(), rounds: Number(r.value) }); };
  const t = $("#" + id + "-time");
  t.oninput = () => { t.nextElementSibling.textContent = t.value + " s"; setS({ ...getS(), timePerQuestion: Number(t.value) }); };
}

function restoreFocus(ds) {

  const attr = "data-" + key.replace(/[A-Z]/g, (m) => "-" + m.toLowerCase());
  const el = app.querySelector(`[${attr}${ds[key] ? `="${ds[key]}"` : ""}]`);
  el && el.focus({ preventScroll: true });
}

let lobby = null;
function newCode() { let s = ""; for (let i = 0; i < 6; i++) s += C.CODE_ALPHABET[Math.floor(Math.random() * C.CODE_ALPHABET.length)]; return s; }

function showLobby(keepPlayers) {
  stopGame();
  if (!lobby || !keepPlayers) {
    lobby = { code: newCode(), players: [me()], bots: [], joinTimers: [] };
    const names = [...BOT_NAMES].sort(() => Math.random() - 0.5).slice(0, 3 + Math.floor(Math.random() * 3));
    names.forEach((name, i) => lobby.joinTimers.push(setTimeout(() => addBot(name), 700 + i * 900 + Math.random() * 600)));
  }
  lobby.players[0] = me();
  renderLobby();
}
function addBot(name) {
  if (!lobby || lobby.players.length >= C.MAX_PLAYERS) return;
  const bot = { id: "bot-" + name, name, skill: 0.55 + Math.random() * 0.45 };
  lobby.bots.push(bot); lobby.players.push({ id: bot.id, name });
  if ($("#slots")) { renderSlots(); sfx.tick(); }
}
function renderSlots() {
  const el = $("#slots"); if (!el) return;
  el.innerHTML = Array.from({ length: C.MAX_PLAYERS }, (_, i) => {
    const p = lobby.players[i];
    if (!p) return `<div class="slot empty">libre</div>`;
    return `<div class="slot filled"><span class="avatar">${esc(p.name[0].toUpperCase())}</span><span class="nm">${esc(p.name)}</span>${i === 0 ? '<span class="host">hôte</span>' : ""}</div>`;
  }).join("");
  $("#playerCount").textContent = `${lobby.players.length} / ${C.MAX_PLAYERS} joueurs`;
  $("#lobbyStart").disabled = lobby.players.length < 2;
}
function renderLobby() {
  setMargin(`<span class="margin-note">lobby</span>`);
  const render = () => {
    const keep = document.activeElement?.dataset;
    view(`<section class="lobby">
      <div class="stack">
        <div><p class="muted">Code du lobby</p>
          <div class="actions"><div class="code-boxes" aria-label="Code ${lobby.code}">${[...lobby.code].map((c) => `<span>${c}</span>`).join("")}</div>
          <button class="btn ghost" type="button" id="copyCode">Copier le code</button></div></div>
        <div class="stack" style="gap:10px"><h3 id="playerCount"></h3><div class="slots" id="slots"></div>
          <div class="actions"><button class="link-btn" type="button" id="addBot">Ajouter un robot</button></div></div>
        <div class="actions"><button class="btn" type="button" id="lobbyStart">Lancer la partie</button><button class="btn ghost" type="button" id="lobbyLeave">Quitter le lobby</button></div>
      </div>
      <div class="stack"><h3>Règles de la partie</h3>${settingsForm("lobbyForm", prefs.online, { online: true })}</div>
    </section>`);
    renderSlots();
    bindSettings("lobbyForm", () => prefs.online, (s) => { prefs.online = C.sanitizeSettings(s); store.set("online", prefs.online); }, render);
    restoreFocus(keep);
    $("#copyCode").onclick = async () => {
      const b = $("#copyCode");
      try { await navigator.clipboard.writeText(lobby.code); b.textContent = "Code copié"; }
      catch { b.textContent = lobby.code; }
      setTimeout(() => (b.textContent = "Copier le code"), 1600);
    };
    $("#addBot").onclick = () => { const free = BOT_NAMES.filter((n) => !lobby.players.some((p) => p.name === n)); if (free.length) addBot(free[0]); };
    $("#lobbyStart").onclick = () => {
      lobby.joinTimers.forEach(clearTimeout);
      startGame({ settings: prefs.online, players: lobby.players.map((p) => ({ id: p.id, name: p.name })), online: true, bots: lobby.bots, back: () => showLobby(true) });
    };

  };

}

/* =================================================================== */
/* Partie                                                                */
/* =================================================================== */
let game = null;

function keypadHTML(id) {
  return `<div class="keypad" id="${id}">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => `<button type="button" data-k="${n}">${n}</button>`).join("")}
    <button type="button" data-k="del" aria-label="Effacer">⌫</button><button type="button" data-k="0">0</button><button type="button" data-k="ok" class="ok-key" aria-label="Valider">OK</button></div>`;
}
function bindKeypad(id, input, submit) {
  $("#" + id).querySelectorAll("button").forEach((b) => (b.onclick = () => {
    if (input.disabled) return;
    const k = b.dataset.k;
    if (k === "ok") return submit();
    if (k === "del") input.value = input.value.slice(0, -1);
    else if (input.value.length < 6) input.value += k;
    input.dispatchEvent(new Event("input"));
  }));
}
function sizeInput(input) { input.style.width = Math.max(2.2, input.value.length + 0.6) + "ch"; }
function checkSVG() { return `<svg class="check" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 13.5l5.5 5L21 5" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }

function stopGame() {
  clearTimeout(heroTimer);
  if (!game) return;
  game.stopped = true;
  cancelAnimationFrame(game.raf);
  game.timers.forEach(clearTimeout);
  game = null;
}
function later(fn, ms) { const g = game; const t = setTimeout(() => { if (game === g && !g.stopped) fn(); }, ms); g.timers.push(t); }

function startGame(opts) {
  stopGame();
  const engine = new C.GameEngine(opts.settings, opts.players, C.randomSeed());
  game = { ...opts, engine, timers: [], raf: 0, closing: false };
  view(`<section class="game">
      <div class="timer" aria-hidden="true"><div class="timer-fill" id="timerFill"></div></div>
      <p class="status" id="status"></p>
      <form id="answerForm" autocomplete="off" class="game-row">
        <span class="calc" id="calc"></span>
      </form>
      <p class="result-line" id="resultLine" aria-live="polite"></p>
      ${touch ? keypadHTML("pad") : ""}
      <div class="players" id="players" ${opts.online ? "" : "hidden"}></div>
      <div class="actions"><button class="link-btn" type="button" id="quit">Quitter la partie</button></div>
    </section>`);
  $("#quit").onclick = () => { const back = game.back; stopGame(); back(); };
  $("#answerForm").onsubmit = (e) => { e.preventDefault(); submitMine(); };
  updateMargin();
  renderPlayers();
  countdown(3);
}

function countdown(n) {
  const calc = $("#calc");
  $("#status").textContent = game.online ? `${MODE_INFO[game.settings.mode].name} · niveau ${game.settings.difficulty}` : MODE_INFO[game.settings.mode].solo;
  if (n === 0) { sfx.go(); return nextRound(); }
  calc.innerHTML = `<span class="count">${n}</span>`;
  sfx.tick();
  later(() => countdown(n - 1), 800);
}

function nextRound() {
  const g = game, e = g.engine;
  const r = e.startRound(Date.now());
  if (!r) return finishGame();
  g.closing = false;
  const mine = e.canAnswer("me");
  const calc = $("#calc");
  calc.className = "calc" + (r.question.text.length > 11 ? " long" : "");
  calc.innerHTML = `<span id="qText">${esc(r.question.text)}</span> <span class="eq">=</span> <input id="answer" class="answer" ${touch ? 'inputmode="none" readonly' : 'inputmode="numeric"'} aria-label="Ta réponse" ${mine ? "" : "disabled"}>`;
  const input = $("#answer");
  input.oninput = () => { input.value = input.value.replace(/\D/g, "").slice(0, 6); sizeInput(input); };
  sizeInput(input);
  if (touch) bindKeypad("pad", input, submitMine);
  $("#resultLine").innerHTML = "";
  const active = r.activePlayerId && e.player(r.activePlayerId);
  if (g.online && g.settings.turnStyle === "turns") $("#status").innerHTML = active?.id === "me" ? "<strong>À toi !</strong>" : `Au tour de <strong>${esc(active.name)}</strong>`;
  else if (g.online && !e.player("me").alive) $("#status").textContent = "Tu es éliminé, tu regardes la fin de la partie.";
  else $("#status").textContent = "";
  if (mine && !touch) input.focus({ preventScroll: true });
  updateMargin(); renderPlayers();
  scheduleBots(r);
  const fill = $("#timerFill");
  const loop = () => {
    if (!game || game !== g || g.stopped) return;
    const left = e.remainingMs(Date.now());
    fill.style.transform = `scaleX(${left / r.timeLimitMs})`;
    fill.classList.toggle("late", left < 3000);
    if (left <= 0) return endRound();
    g.raf = requestAnimationFrame(loop);
  };
  loop();
}

function scheduleBots(r) {
  const g = game, e = g.engine;
  if (!g.bots) return;
  const base = [1400, 2100, 3100, 4700, 6800][g.settings.difficulty - 1];
  for (const bot of g.bots) {
    if (!e.canAnswer(bot.id)) continue;
    const delay = base * (1.7 - bot.skill) * (0.65 + Math.random() * 0.8);
    if (delay > r.timeLimitMs * 0.97) continue; // trop lent : le temps s'écoule
    const accuracy = 0.72 + 0.24 * bot.skill - 0.035 * (g.settings.difficulty - 1);
    const right = Math.random() < accuracy;
    const value = right ? r.question.answer : Math.max(0, r.question.answer + (Math.random() < 0.5 ? -1 : 1) * (1 + Math.floor(Math.random() * 3)));
    if (g.settings.turnStyle === "turns") {
      // Les autres voient la réponse du joueur actif s'écrire.
      const digits = String(value);
      [...digits].forEach((_, i) => later(() => { const inp = $("#answer"); if (inp && e.currentRound?.index === r.index) { inp.value = digits.slice(0, i + 1); sizeInput(inp); } }, delay - 350 + (i * 300) / digits.length));
    }
    later(() => {
      if (e.currentRound?.index !== r.index) return;
      const res = e.submit(bot.id, value, Date.now());
      if (!res.accepted) return;
      renderPlayers();
      if (res.roundCanClose) endRound();
    }, delay);
  }
}

function submitMine() {
  const g = game; if (!g) return;
  const e = g.engine, input = $("#answer");
  if (!input || input.disabled || input.value === "" || !e.canAnswer("me")) return;
  const res = e.submit("me", Number(input.value), Date.now());
  if (!res.accepted) return;
  input.disabled = true;
  if (res.correct) {
    input.classList.add("right"); sfx.ok();
    $("#resultLine").innerHTML = `<span class="ok">${checkSVG()} ${fmtS(res.timeMs)}</span>`;
  } else {
    input.classList.add("wrong"); sfx.ko();
    $("#calc").classList.add("shake"); later(() => $("#calc")?.classList.remove("shake"), 320);
  }
  renderPlayers();
  if (res.roundCanClose) endRound();
}

function endRound() {
  const g = game; if (!g || g.closing) return;
  const e = g.engine;
  if (!e.currentRound) return;
  g.closing = true;
  cancelAnimationFrame(g.raf);
  const rec = e.closeRound();
  const myAns = rec.answers.find((a) => a.playerId === "me");
  const line = $("#resultLine");
  const names = (ids) => ids.map((id) => esc(e.player(id).name)).join(", ");
  const input = $("#answer");
  if (input) input.disabled = true;
  let html = "";
  if (myAns && myAns.correct) html = `<span class="ok">${checkSVG()} ${fmtS(myAns.timeMs)}</span>`;
  else if (myAns) { html = `<span class="ko">${myAns.value == null ? "temps écoulé" : "non"} : ${rec.question.answer}</span>`; if (myAns.value == null) sfx.ko(); }
  else html = `<span>= ${rec.question.answer}</span>`;
  if (g.online) {
    if (rec.scorers.length && !rec.scorers.includes("me")) html += ` <span class="muted">· point pour ${names(rec.scorers)}</span>`;
    if (rec.spared) html += ` <span class="muted">· personne ne sort</span>`;
    if (rec.eliminated.length) { html += ` <span class="ko">· éliminé : ${names(rec.eliminated)}</span>`; if (rec.eliminated.includes("me")) sfx.out(); }
    if (input && g.settings.turnStyle === "turns" && rec.activePlayerId !== "me") {
      const a = rec.answers[0];
      input.classList.add(a && a.correct ? "right" : "wrong");
    }
  }
  line.innerHTML = html;
  updateMargin(); renderPlayers();
  const solo = !g.online;
  const pause = solo ? (myAns && myAns.correct ? 700 : 1500) : 1900;
  later(() => (e.isOver ? finishGame() : nextRound()), pause);
}

function updateMargin() {
  const g = game; if (!g) return;
  const e = g.engine, mine = e.player("me");
  const round = e.currentRound ? e.currentRound.index + 1 : e.roundsPlayed;
  const total = g.settings.mode === "speed-race" ? `/${e.totalRounds}` : "";
  setMargin(`<span class="margin-note">${round}${total}<small>manche</small></span><span class="margin-note"><span class="grade">${mine.score}</span><small>${g.settings.mode === "speed-race" ? "points" : "justes"}</small></span>`);
}

function renderPlayers() {
  const g = game; if (!g || !g.online) return;
  const e = g.engine, r = e.currentRound;
  $("#players").innerHTML = e.standings().map(({ player: p }) => {
    const a = r && r.answers.find((x) => x.playerId === p.id);
    const cls = ["chip", p.id === "me" ? "me" : "", !p.alive ? "out" : "", r && r.activePlayerId === p.id ? "active" : "",
      a ? (p.id === "me" || e.rules.id === "speed-race" ? (a.correct ? "right" : "wrong") : "answered") : ""].join(" ");
    return `<span class="${cls}"><span class="avatar">${esc(p.name[0].toUpperCase())}</span><span class="nm">${esc(p.name)}</span><span class="pts">${p.score}</span></span>`;
  }).join("");
}

/* =================================================================== */
/* Rapport de fin de partie                                              */
/* =================================================================== */
function finishGame() {
  const g = game; const e = g.engine;
  const report = C.buildReport(e.standings(), e.history);
  const mine = report.players.find((p) => p.playerId === "me");
  const n = report.players.length;
  const won = g.online && mine.rank === 1;
  if (won) { sfx.win(); confetti({ particleCount: 140, spread: 80, origin: { y: 0.35 } }); }
  else if (!g.online && mine.correct > 0) sfx.go();

  let big, sub;
  if (g.online) {
    big = mine.rank === 1 ? "1er !" : `${mine.rank}e`;
    sub = mine.rank === 1 ? (g.settings.mode === "battle-royale" ? "Dernier en vie. Bien joué." : "Le plus rapide de la partie.") : `sur ${n} joueurs. Vainqueur : ${esc(report.players[0].name)}.`;
  } else if (g.settings.mode === "battle-royale") {
    big = `${mine.score}`; sub = mine.score > 1 ? "calculs justes d'affilée" : "calcul juste avant l'erreur";
  } else {
    big = `${mine.score}/${report.rounds}`; sub = mine.score === report.rounds ? "Sans faute." : "bonnes réponses";
  }

  setMargin(`<span class="margin-note">fin</span>`);
  view(`<section class="report">
    <div class="verdict"><span class="big">${big}</span><p class="lede" style="margin:0">${sub}</p></div>
    ${g.online ? `<ol class="ranking">${report.players.map((p) => `
      <li class="${p.playerId === "me" ? "me" : ""}"><span class="rk">${p.rank}</span>
        <span><strong>${esc(p.name)}</strong><span class="sub">${p.answered ? pct(p.accuracy) + " de réussite" : "aucune réponse"}${p.avgCorrectMs != null ? " · " + fmtS(p.avgCorrectMs) + " en moyenne" : ""}${g.settings.mode === "battle-royale" && !p.alive ? " · sorti manche " + (p.eliminatedAt + 1) : ""}</span></span>
        <span class="sc">${p.score} ${g.settings.mode === "speed-race" ? "pts" : "justes"}</span></li>`).join("")}</ol>` : ""}
    <div class="stats">
      <div class="stat"><span class="v">${pct(mine.accuracy)}</span><span class="k">de réussite</span></div>
      <div class="stat"><span class="v">${mine.avgCorrectMs != null ? fmtS(mine.avgCorrectMs) : "–"}</span><span class="k">temps moyen</span></div>
      <div class="stat"><span class="v">${mine.fastestMs != null ? fmtS(mine.fastestMs) : "–"}</span><span class="k">plus rapide</span></div>
      <div class="stat"><span class="v">${mine.bestStreak}</span><span class="k">meilleure série</span></div>
    </div>
    <div class="two">
      <div class="stack"><h3>Ton temps à chaque calcul</h3>${timelineSVG(mine.timeline, g.settings.timePerQuestion * 1000)}
        <p class="callout">Barres bleues : bonnes réponses. Croix rouges : erreurs ou temps écoulé.</p></div>
      <div class="stack"><h3>Par type de calcul</h3><div class="bars">${mine.byOperation.map((o) => `
        <div class="bar-row"><span>${OP_NAMES[o.tag]}</span><span class="bar"><i style="width:${o.attempts ? (o.correct / o.attempts) * 100 : 0}%"></i></span><span class="pc">${o.correct}/${o.attempts}</span></div>`).join("") || '<p class="muted">Aucune réponse.</p>'}</div>
        ${report.hardest ? `<p class="callout">Le calcul le plus raté<b>${esc(report.hardest.text)} = ${report.hardest.answer}</b></p>` : ""}
      </div>
    </div>
    <div class="actions">
      <button class="btn" type="button" id="again">Rejouer la même partie</button>
      <button class="btn ghost" type="button" id="change">${g.online ? "Rejouer avec d'autres paramètres" : "Changer les paramètres"}</button>
      <button class="link-btn" type="button" id="menu">Menu principal</button>
    </div>
    ${g.online ? '<p class="note">Les mêmes joueurs restent ensemble, que tu rejoues à l\'identique ou avec d\'autres règles.</p>' : ""}
  </section>`);
  const opts = { settings: g.settings, players: g.players, online: g.online, bots: g.bots, back: g.back };
  $("#again").onclick = () => startGame(opts);
  $("#change").onclick = () => { stopGame(); g.online ? showLobby(true) : showSoloSetup(); };
  $("#menu").onclick = () => { stopGame(); showHome(); };
  game.stopped = true;
}

function timelineSVG(tl, maxMs) {
  if (!tl.length) return '<p class="muted">Aucune réponse.</p>';
  const W = 420, H = 150, pad = { l: 34, r: 8, t: 10, b: 22 };
  const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
  const top = Math.max(1000, Math.ceil(Math.max(...tl.map((x) => x.timeMs || 0), maxMs * 0.25) / 1000) * 1000);
  const bw = Math.min(22, iw / tl.length - 3);
  const x = (i) => pad.l + (i + 0.5) * (iw / tl.length);
  const y = (ms) => pad.t + ih - (ms / top) * ih;
  const ticks = [0, top / 2, top];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Temps de réponse par calcul">
    ${ticks.map((t) => `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line-strong)" stroke-width="1"/><text x="${pad.l - 6}" y="${y(t) + 4}" text-anchor="end">${t / 1000} s</text>`).join("")}
    ${tl.map((p, i) => p.correct
      ? `<rect x="${x(i) - bw / 2}" y="${y(p.timeMs)}" width="${bw}" height="${Math.max(2, ih - (y(p.timeMs) - pad.t))}" rx="3" fill="var(--ink)"/>`
      : `<path d="M${x(i) - 5} ${pad.t + ih - 14}l10 10M${x(i) + 5} ${pad.t + ih - 14}l-10 10" stroke="var(--ko)" stroke-width="2.5" stroke-linecap="round" fill="none"/>`).join("")}
    ${tl.map((p, i) => (tl.length <= 20 || i % 5 === 4) ? `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${p.round}</text>` : "").join("")}
  </svg>`;
}

showHome();
})();
</script>
